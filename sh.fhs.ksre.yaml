app-id: sh.fhs.ksre
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: ksre
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '26.08'
    autodelete: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --socket=pulseaudio
  - --persist=.renpy
  - --persist=mods
  - --filesystem=xdg-run/discord-ipc-0
modules:
  - name: ksre
    buildsystem: simple
    build-commands:
      - mkdir -p "${FLATPAK_DEST}/ksre"
      - tar -xjf ksre.tar.bz2 -C "${FLATPAK_DEST}/ksre" --strip-components=1
      - install -Dm755 -t "${FLATPAK_DEST}/bin/" "flatpak/ksre"
      - install -Dm644 -t "${FLATPAK_DEST}/share/appdata/" "flatpak/${FLATPAK_ID}.appdata.xml"
      - install -Dm644 -t "${FLATPAK_DEST}/share/applications/" "flatpak/${FLATPAK_ID}.desktop"
      - install -Dm644 "flatpak/${FLATPAK_ID}.svg" "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
    sources:
      - type: file
        url: https://github.com/fleetingheart/ksre/releases/download/v2.0.5/KSRE-linux.tar.bz2
        sha256: bc648fe1a3a1c59a8f8b7296480dccfbaf98708b33c4cfd1a18f693232beee84
        dest-filename: ksre.tar.bz2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/fleetingheart/ksre/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "KSRE-linux.tar.bz2") | .browser_download_url
      - type: git
        url: https://codeberg.org/fhs/flatpak.git
        commit: 28f38b35bdb9b244161d4aa23a02531aaf98124f
        dest: flatpak
        x-checker-data:
          type: git
          branch: master
